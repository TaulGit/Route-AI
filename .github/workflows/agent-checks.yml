name: Agent checks
on: [push, pull_request]
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-agent.lock.txt
      - run: pip install -r backend/requirements-agent.lock.txt
      - run: python -m pytest -q
      - run: PYTHONPATH=backend python -m evals.run --report /tmp/routeai-eval.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
